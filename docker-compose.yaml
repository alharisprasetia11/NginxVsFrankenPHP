services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    command: --max_connections=1000
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  php-fpm:
    build:
      context: .
      args:
        BASE_IMAGE: php:8.3-fpm
    volumes:
      - ./src:/var/www/html
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "9001:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    networks:
      - app-network

  frankenphp:
    build:
      context: .
      args:
        BASE_IMAGE: dunglas/frankenphp
    ports:
      - "9002:80"
      - "9443:443"
    volumes:
      - ./src:/app/public
    environment:
      - FRANKENPHP_CONFIG=worker /app/public/index.php
      - SERVER_NAME=http://
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: