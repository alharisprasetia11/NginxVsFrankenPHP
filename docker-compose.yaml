# Hanya SATU stack uji yang dijalankan per sesi (lewat --profile):
#   docker compose --profile nginx up -d --build
#   docker compose --profile franken-classic up -d --build
#   docker compose --profile franken-worker up -d --build
# Gunakan run-benchmark.sh agar semuanya otomatis.

name: nvf

x-web-limits: &web-limits
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

services:
  db:
    image: ${MYSQL_IMAGE}
    command:
      - --max_connections=${DB_MAX_CONN:-1000}
      - --innodb_buffer_pool_size=${DB_BUFFER_POOL:-256M}
      - --performance_schema=OFF
      - --innodb_flush_log_at_trx_commit=2
      - --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    cpus: ${DB_CPUS}
    mem_limit: ${DB_MEM}
    healthcheck:
      # Lewat TCP + user aplikasi + tabel terisi: baru "healthy" setelah init.sql selesai
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -umyuser -pmypassword -e 'SELECT 1 FROM myapp.users LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
    networks: [app-network]

  # ---------- Varian 1: Nginx + PHP-FPM  (port 9001) ----------
  php-fpm:
    profiles: [nginx]
    build:
      context: .
      target: fpm
      args:
        BASE_IMAGE: ${PHP_FPM_IMAGE}
        APP_DIR: /var/www/html
    image: nvf/php-fpm:local
    environment:
      APP_MODE: fpm
      FPM_MAX_CHILDREN: ${FPM_MAX_CHILDREN}
    cpus: ${FPM_CPUS}
    mem_limit: ${APP_MEM}
    depends_on:
      db:
        condition: service_healthy
    networks: [app-network]

  nginx:
    profiles: [nginx]
    image: ${NGINX_IMAGE}
    ports:
      - "9001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    cpus: ${WEB_CPUS}
    mem_limit: ${WEB_MEM}
    <<: *web-limits
    depends_on:
      - php-fpm
    networks: [app-network]

  # ---------- Varian 2: FrankenPHP classic, tanpa worker  (port 9002) ----------
  frankenphp-classic:
    profiles: [franken-classic]
    build:
      context: .
      target: franken
      args:
        BASE_IMAGE: ${FRANKEN_IMAGE}
        APP_DIR: /app/public
    image: nvf/frankenphp:local
    ports:
      - "9002:80"
    volumes:
      - ./franken/Caddyfile.classic:/etc/caddy/Caddyfile:ro
    environment:
      APP_MODE: classic
      PHP_THREADS: ${PHP_THREADS}
    cpus: ${FRANKEN_CPUS}
    mem_limit: ${APP_MEM}
    <<: *web-limits
    depends_on:
      db:
        condition: service_healthy
    networks: [app-network]

  # ---------- Varian 3: FrankenPHP worker mode  (port 9003) ----------
  frankenphp-worker:
    profiles: [franken-worker]
    build:
      context: .
      target: franken
      args:
        BASE_IMAGE: ${FRANKEN_IMAGE}
        APP_DIR: /app/public
    image: nvf/frankenphp:local
    ports:
      - "9003:80"
    volumes:
      - ./franken/Caddyfile.worker:/etc/caddy/Caddyfile:ro
    environment:
      APP_MODE: worker
      PHP_THREADS: ${PHP_THREADS}
      PHP_THREADS_TOTAL: ${PHP_THREADS_TOTAL}
    cpus: ${FRANKEN_CPUS}
    mem_limit: ${APP_MEM}
    <<: *web-limits
    depends_on:
      db:
        condition: service_healthy
    networks: [app-network]

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
